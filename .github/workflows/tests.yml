name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build and install the package
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install dist/llm_alpha_mining-*.whl 'pytest>=8,<9'
      - name: Run the test suite against the installed package
        run: python -m pytest -q
      - name: Run outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          alpha-demo --output demo
          alpha-demo --output demo --verify
          alpha-workspace init --workspace research-workspace
          alpha-workspace status --workspace research-workspace
          alpha-workspace verify --workspace research-workspace
